name: Build

on:
  push:
    branches: [ main, 'claude/**' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build src/CyaNotch/CyaNotch.csproj -c Debug

      - name: Publish single exe
        run: dotnet publish src/CyaNotch/CyaNotch.csproj -c Release -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: CyaNotch-win-x64
          path: publish/CyaNotch.exe
